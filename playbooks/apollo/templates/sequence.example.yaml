# Reusable email sequence template. Replayed into Apollo via `add_contacts_to_sequence`
# after the sequence steps are created in the Apollo UI (the MCP adds contacts + toggles
# status; step authoring is done in-app, so keep the canonical copy here and mirror it).

name: "SaaS Marketing Leaders — Outbound v1"
sending_account: "you@smmt.example"      # must exist in list_email_accounts
timezone: "America/New_York"
steps:
  - day: 0
    type: email
    subject: "{{company}} + a 12% lift idea"
    body: |
      Hi {{first_name}},

      Saw {{company}} is hiring on the marketing side — usually a sign you're scaling
      acquisition faster than the loops can keep up.

      We build the closed-loop automation between Shopify, Klaviyo, Meta, and Amazon so each
      campaign compounds the next. Worth a 15-min look?

      — {{sender_name}}
  - day: 3
    type: email
    subject: "re: {{company}} + a 12% lift idea"
    body: |
      Hi {{first_name}}, bumping this in case it slipped. One sentence: we make your audience
      reusable across every platform so you stop paying to re-acquire the same people.
  - day: 7
    type: email
    subject: "last note"
    body: |
      Hi {{first_name}} — I'll close the loop here (pun intended). If retention/acquisition
      automation is on the roadmap this quarter, reply "loops" and I'll send a 2-min teardown.
